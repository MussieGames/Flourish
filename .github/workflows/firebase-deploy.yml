name: Deploy Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable reCAPTCHA Enterprise API
        continue-on-error: true
        run: gcloud services enable recaptchaenterprise.googleapis.com --project=flourish-7b8c8

      - name: Grant reCAPTCHA Enterprise Agent role
        continue-on-error: true
        run: |
          gcloud projects add-iam-policy-binding flourish-7b8c8 \
            --member="serviceAccount:firebase-adminsdk-fbsvc@flourish-7b8c8.iam.gserviceaccount.com" \
            --role="roles/recaptchaenterprise.agent" \
            --condition=None

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Remove stale Cloud Functions
        run: |
          firebase functions:delete handleNewWaitlist \
            --region australia-southeast1 \
            --project flourish-7b8c8 \
            --force \
            --non-interactive || true

      - name: Deploy functions and Firestore rules
        run: firebase deploy --only functions,firestore:rules --project flourish-7b8c8 --non-interactive --force
