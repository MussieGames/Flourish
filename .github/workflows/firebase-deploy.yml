name: Deploy Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify reCAPTCHA Enterprise API is enabled
        run: |
          enabled_service="$(gcloud services list \
            --enabled \
            --project=flourish-7b8c8 \
            --filter='config.name=recaptchaenterprise.googleapis.com' \
            --format='value(config.name)')"

          if [ -z "$enabled_service" ]; then
            echo "::error::reCAPTCHA Enterprise API is not enabled, or this workflow cannot verify it."
            exit 1
          fi

      - name: Verify reCAPTCHA Enterprise Agent role
        run: |
          service_account="serviceAccount:firebase-adminsdk-fbsvc@flourish-7b8c8.iam.gserviceaccount.com"
          assigned_role="$(gcloud projects get-iam-policy flourish-7b8c8 \
            --flatten='bindings[].members' \
            --filter="bindings.role=roles/recaptchaenterprise.agent AND bindings.members=${service_account}" \
            --format='value(bindings.role)')"

          if [ -z "$assigned_role" ]; then
            echo "::error::${service_account} is missing roles/recaptchaenterprise.agent, or this workflow cannot verify it."
            exit 1
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Remove stale Cloud Functions
        run: |
          firebase functions:delete handleNewWaitlist \
            --region australia-southeast1 \
            --project flourish-7b8c8 \
            --force \
            --non-interactive || true

      - name: Deploy functions and Firestore rules
        run: firebase deploy --only functions,firestore:rules --project flourish-7b8c8 --non-interactive --force
