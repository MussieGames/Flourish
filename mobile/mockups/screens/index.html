<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flourish — Screen mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FBF7F2; --sienna:#C17B5C; --ink:#2C2420; --ink-l:#5C4A42; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--ink); }
  .page { max-width:1100px; margin:0 auto; padding:48px 24px 96px; }
  .kicker { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--sienna); font-weight:500; margin-bottom:14px; }
  h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:42px; line-height:1.1; margin-bottom:12px; }
  h1 em { font-style:italic; color:var(--sienna); }
  .lede { font-size:16px; line-height:1.6; color:var(--ink-l); max-width:560px; margin-bottom:36px; }
  .grid { display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
  figure { width:320px; margin:0; }
  img { width:100%; height:auto; border-radius:36px; box-shadow:0 24px 48px rgba(44,36,32,.16); display:block; background:#2C2420; }
  figcaption { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8C7870; text-align:center; margin-top:12px; }
</style>
</head>
<body>
<div class="page">
